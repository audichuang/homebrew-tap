name: Update AionUi Dev Cask/Formula

on:
  repository_dispatch:
    types: [update-aionui-dev]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.8.23-my-abc1234)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    name: Update AionUi Dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout homebrew-tap
        uses: actions/checkout@v6

      # Rewrites only version/sha256/url in place: the tap files stay the
      # source of truth for every other stanza, so they cannot drift from
      # a template kept here.
      - name: Update Cask (macOS) and Formula (Linux)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
        run: |
          set -euo pipefail
          # v1.8.23-my-abc1234 → 1.8.23
          VERSION="${TAG#v}"
          VERSION="${VERSION%%-my-*}"

          digest() {
            gh release view "$TAG" --repo audichuang/AionUi --json assets \
              --jq ".assets[] | select(.name == \"$1\") | .digest" | sed 's/^sha256://'
          }
          DMG="AionUi-${VERSION}-mac-arm64.dmg"
          APPIMAGE="AionUi-${VERSION}-linux-x86_64.AppImage"
          DMG_SHA="$(digest "$DMG")"
          APPIMAGE_SHA="$(digest "$APPIMAGE")"
          for sha in "$DMG_SHA" "$APPIMAGE_SHA"; do
            [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::missing sha256 for a release asset of $TAG"; exit 1; }
          done

          # Plain vX.Y.Z tags keep the cask's idiomatic v#{version} path.
          DL_TAG="$TAG"
          [ "$TAG" = "v${VERSION}" ] && DL_TAG='v#{version}'
          sed -i -E \
            -e "s|^  version \".*\"|  version \"${VERSION}\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${DMG_SHA}\"|" \
            -e "s|/releases/download/[^/]+/|/releases/download/${DL_TAG}/|" \
            Casks/aionui-dev.rb
          sed -i -E \
            -e "s|^  url \".*\"|  url \"https://github.com/audichuang/AionUi/releases/download/${TAG}/${APPIMAGE}\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${APPIMAGE_SHA}\"|" \
            Formula/aionui-dev.rb
          git diff

      - name: Commit and push
        env:
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/aionui-dev.rb Formula/aionui-dev.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update aionui-dev to ${TAG}"
          git push
